<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // The address can carry a data link after the app's folder (…/datadrop/https://host/file.csv); GitHub Pages answers
    // those with this page as 404.html. Resolve ./app.js, ./duckdb/ etc. against the app's folder, never the link.
    (function () {
      var p = location.pathname, m = p.match(/^(.*?\/)(?:https?|s3|gs|hf):\//i);
      var b = document.createElement('base');
      b.href = m ? m[1] : p.replace(/[^/]*$/, '');
      document.head.appendChild(b);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataDrop</title>
  <meta name="description" content="Paste any public data URL and get an interactive dashboard. DuckDB-WASM and AI agents, all in your browser.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b6e4f'/%3E%3Crect x='3' y='8' width='2' height='5' fill='white'/%3E%3Crect x='7' y='5' width='2' height='8' fill='white'/%3E%3Crect x='11' y='3' width='2' height='10' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/vega.min.js"></script>
  <script src="./vendor/vega-lite.min.js"></script>
  <script src="./vendor/vega-embed.min.js"></script>
</head>
<body>
  <div id="app"><noscript>DataDrop needs JavaScript.</noscript></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
